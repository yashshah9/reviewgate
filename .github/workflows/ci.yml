name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install "platformkit @ git+https://github.com/yashshah9/platformkit.git"
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          mypy src/reviewgate
      - name: Unit tests
        run: pytest tests/test_api.py -q
      - name: Eval gate
        run: reviewgate eval --min-pass-rate 1.0
